[phases.setup]
nixPkgs = ["nodejs_20", "npm", "postgresql"]

[phases.install]
cmds = [
  "npm install --legacy-peer-deps"
]

[phases.build]
cmds = [
  "chmod +x apps/backend/railway-build-simple.sh && ./apps/backend/railway-build-simple.sh"
]

[start]
cmd = "node apps/backend/dist/main.js"

[variables]
NODE_ENV = "production"
PORT = "3000"
